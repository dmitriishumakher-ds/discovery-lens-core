[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discovery-lens"
version = "2.0.0a0"
description = "Turn qualitative discovery data into an evidence-backed Opportunity-Solution Tree"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dmitrii Shumakher" }]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# ML stack — heavy, only needed to actually run embeddings/clustering/sentiment.
# Kept out of core so unit tests and the eval harness's pure-logic parts stay light.
ml = [
    "sentence-transformers>=2.7",
    "bertopic>=0.16",
    "hdbscan>=0.8.40",
    "umap-learn>=0.5.5",
    "scikit-learn>=1.4",
    "transformers>=4.40",
    "torch>=2.2",
]
# LLM step
llm = ["groq>=1.3"]
# Lexical retrieval baseline (pure python, CI-friendly)
retrieval = ["rank-bm25>=0.2"]
# File parsing
parsing = ["pypdf>=4.1", "python-docx>=1.1", "pandas>=2.2", "nltk>=3.8.1"]
# Streamlit UI adapter
app = ["streamlit>=1.32", "plotly>=5.20", "python-dotenv>=1.0"]
# Dev tooling
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10", "rank-bm25>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
